<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Hockey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a1a;
    font-family: 'Press Start 2P', monospace;
  }
  #game-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  #scoreboard {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 6px 0; color: #fff; font-size: 11px; letter-spacing: 1px;
    width: 100%; max-width: 420px;
  }
  .team-score { display: flex; align-items: center; gap: 6px; }
  .team-dot { width: 10px; height: 10px; border-radius: 2px; }
  .team-dot { }
  #period-info { color: #8888aa; font-size: 9px; }
  #game-time { color: #ffcc00; font-size: 13px; font-weight: bold; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid #334;
    border-radius: 4px;
  }
  #msg-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,5,20,0.85); color: #fff; z-index: 10;
    font-family: 'Press Start 2P', monospace; text-align: center;
    pointer-events: auto; cursor: pointer;
  }
  #msg-overlay.hidden { display: none; }
  #msg-overlay h1 { font-size: 18px; color: #ffcc00; margin-bottom: 16px; text-shadow: 2px 2px #000; }
  #msg-overlay p { font-size: 10px; color: #aaa; line-height: 1.8; }
  #goal-flash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center;
    z-index: 5; pointer-events: none;
  }
  #goal-flash span {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px; text-shadow: 3px 3px #000;
    animation: goalPulse 0.6s ease-out;
  }
  @keyframes goalPulse {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #speed-controls {
    display: flex; gap: 8px; margin-top: 6px;
  }
  #speed-controls button {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; padding: 4px 10px;
    background: #1a1a2e; color: #8888aa; border: 1px solid #334;
    border-radius: 3px; cursor: pointer;
  }
  #speed-controls button.active {
    color: #ffcc00; border-color: #ffcc00;
  }
  /* ─── FRANCHISE UI ─────────────────────────────── */
  #franchise-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,5,20,0.95); color: #fff; z-index: 20;
    font-family: 'Press Start 2P', monospace; text-align: center;
    overflow-y: auto; padding: 32px 16px;
  }
  #franchise-screen.hidden { display: none; }
  #franchise-content { max-width: 960px; width: 100%; }
  .fr-title { font-size: 22px; color: #ffcc00; margin-bottom: 24px; text-shadow: 2px 2px #000; }
  .fr-subtitle { font-size: 13px; color: #8888aa; margin-bottom: 32px; }
  .fr-btn {
    font-family: 'Press Start 2P', monospace; font-size: 14px;
    padding: 20px 40px; margin: 12px;
    background: #1a1a2e; color: #ddd; border: 2px solid #445;
    border-radius: 6px; cursor: pointer; transition: all 0.15s;
    display: inline-block;
  }
  .fr-btn:hover { color: #ffcc00; border-color: #ffcc00; background: #222244; }
  .fr-btn:active { transform: scale(0.96); }
  .fr-btn.primary { color: #ffcc00; border-color: #ffcc00; }
  .fr-btn.disabled { opacity: 0.3; pointer-events: none; }
  .fr-btn.team-btn { padding: 24px 32px; margin: 8px; font-size: 15px; min-width: 150px; }
  .fr-table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 20px 0; text-align: left; }
  .fr-table th { color: #8888aa; padding: 10px 8px; border-bottom: 1px solid #334; }
  .fr-table td { padding: 10px 8px; border-bottom: 1px solid #1a1a2e; }
  .fr-table tr.my-team td { color: #ffcc00; }
  .fr-table tr.playoff-line td { border-bottom: 1px dashed #ffcc00; }
  .fr-results { font-size: 11px; color: #aaa; margin: 16px 0; line-height: 3; text-align: left; }
  .fr-results .win { color: #5f5; }
  .fr-results .loss { color: #f55; }
  .fr-results .otl { color: #fa5; }
  .fr-roster-card {
    background: #111128; border: 1px solid #334; border-radius: 8px;
    padding: 16px; margin: 12px 0; text-align: left;
  }
  .fr-roster-card.has-points { border-color: #ffcc00; }
  .fr-player-name { font-size: 15px; color: #ddd; }
  .fr-player-role { font-size: 13px; color: #8888aa; margin-left: 8px; }
  .fr-player-level { font-size: 13px; color: #ffcc00; float: right; }
  .fr-stats { margin-top: 10px; }
  .fr-stat-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; min-height: 28px; }
  .fr-stat-label { width: 58px; color: #8888aa; text-align: right; }
  .fr-stat-bar { display: flex; gap: 4px; }
  .fr-stat-pip { width: 16px; height: 12px; border-radius: 2px; background: #222; border: 1px solid #334; }
  .fr-stat-pip.filled { background: #4488cc; border-color: #5599dd; }
  .fr-stat-pip.filled.high { background: #44cc66; border-color: #55dd77; }
  .fr-stat-val { color: #aaa; width: 20px; text-align: right; }
  .fr-upgrade-btn {
    font-family: 'Press Start 2P', monospace; font-size: 12px;
    padding: 4px 8px; margin-left: 6px;
    background: #332200; color: #ffcc00; border: 1px solid #ffcc00;
    border-radius: 2px; cursor: pointer;
  }
  .fr-upgrade-btn:hover { background: #443300; }
  .fr-btn-placeholder { display: inline-block; width: 28px; margin-left: 6px; }
  .fr-downgrade-btn { color: #ff6666; border-color: #ff6666; background: #220000; }
  .fr-downgrade-btn:hover { background: #330000; }
  .fr-stat-pip.pending { background: #cc8800; border-color: #ddaa00; animation: pip-pulse 1s ease-in-out infinite; }
  @keyframes pip-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .fr-pending-delta { color: #cc8800; font-size: 10px; margin-left: 2px; }
  .fr-roster-actions { display: flex; gap: 12px; justify-content: center; margin-top: 10px; }
  .fr-save-btn { background: #224400 !important; border-color: #44cc00 !important; color: #44cc00 !important; }
  .fr-save-btn:hover { background: #336600 !important; }
  .fr-cancel-btn { background: #330000 !important; border-color: #cc4444 !important; color: #cc4444 !important; }
  .fr-cancel-btn:hover { background: #440000 !important; }
  .fr-xp-bar { width: 100%; height: 8px; background: #222; border-radius: 4px; margin-top: 8px; }
  .fr-xp-fill { height: 100%; background: #8855cc; border-radius: 4px; transition: width 0.3s; }
  .fr-event-card {
    background: #1a1a30; border: 1px solid #556; border-radius: 8px;
    padding: 20px; margin: 20px 0; font-size: 12px; color: #ddd; line-height: 2;
  }
  .fr-matchup { display: flex; align-items: center; justify-content: center; gap: 32px; margin: 32px 0; }
  .fr-matchup-team { font-size: 20px; }
  .fr-matchup-vs { font-size: 13px; color: #8888aa; }
  .fr-post-player { font-size: 11px; text-align: left; padding: 6px 0; line-height: 2.4; color: #ccc; }
  .fr-post-player .xp { color: #8855cc; }
  .fr-post-player .levelup { color: #ffcc00; }
  .fr-bracket { font-size: 11px; margin: 24px 0; }
  .fr-bracket-round { margin: 16px 0; }
  .fr-bracket-game { display: inline-block; background: #111128; border: 1px solid #334; border-radius: 5px; padding: 12px 20px; margin: 6px; }
  .fr-bracket-winner { color: #ffcc00; }
  .fr-section-title { font-size: 13px; color: #ffcc00; margin: 28px 0 12px 0; text-align: left; }
  .fr-scroll { max-height: 75vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fr-roster-card { margin: 0; }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="scoreboard">
    <div class="team-score"><div class="team-dot" id="dot-0"></div><span id="score-0">0</span></div>
    <span id="period-info">P1</span>
    <span id="game-time">20:00</span>
    <div class="team-score"><span id="score-1">0</span><div class="team-dot" id="dot-1"></div></div>
  </div>
  <canvas id="c"></canvas>
  <div id="speed-controls">
    <button onclick="setSpeed(0.5)">0.5x</button>
    <button class="active" onclick="setSpeed(1)">1x</button>
    <button onclick="setSpeed(2)">2x</button>
    <button onclick="setSpeed(3)">3x</button>
  </div>
</div>

<div id="msg-overlay" class="hidden">
  <h1>🏒 PIXEL HOCKEY</h1>
  <p id="menu-matchup"></p>
</div>
<div id="goal-flash"><span>GOAL!</span></div>
<div id="franchise-screen"><div id="franchise-content"></div></div>

<script src="renderer.js"></script>
<script src="ai.js"></script>
<script src="season.js"></script>
<script src="franchise-ui.js"></script>
<script>
// ─── CONFIG ─────────────────────────────────────────────
const RINK_W = 240;
const RINK_H = 400;
const S = 2;
const W = RINK_W * S;
const H = RINK_H * S;

const PEN_BOX_W = 38 * S; // penalty box width outside rink
const RINK_X = PEN_BOX_W; // left offset to center rink
const CANVAS_W = W + PEN_BOX_W * 2;

const canvas = document.getElementById('c');
canvas.width = CANVAS_W; canvas.height = H;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ─── TEAMS ─────────────────────────────────────────────
const TEAMS = [
  { name: 'RED',    body: '#d03030', outline: '#901818', helmet: '#ff5050', light: '#ff5050', dot: '#e04040', bg: 'rgba(255,60,60,0.15)',  goalFill: 'rgba(200,50,50,0.15)',  goalStroke: '#c04040', goalNet: 'rgba(192,64,64,0.3)' },
  { name: 'BLUE',   body: '#2060d0', outline: '#103080', helmet: '#50a0ff', light: '#50a0ff', dot: '#4080e0', bg: 'rgba(60,100,255,0.15)', goalFill: 'rgba(50,80,200,0.15)',  goalStroke: '#3060c0', goalNet: 'rgba(48,96,192,0.3)' },
  { name: 'GREEN',  body: '#20a040', outline: '#107020', helmet: '#50e070', light: '#50e070', dot: '#40c060', bg: 'rgba(60,255,100,0.15)', goalFill: 'rgba(50,200,80,0.15)',  goalStroke: '#30a050', goalNet: 'rgba(48,192,80,0.3)' },
  { name: 'YELLOW', body: '#c0a020', outline: '#907010', helmet: '#ffe050', light: '#ffe050', dot: '#d0b030', bg: 'rgba(255,220,60,0.15)', goalFill: 'rgba(200,180,50,0.15)', goalStroke: '#c0a030', goalNet: 'rgba(192,170,48,0.3)' },
  { name: 'PURPLE', body: '#8030c0', outline: '#501880', helmet: '#c060ff', light: '#c060ff', dot: '#9050d0', bg: 'rgba(160,60,255,0.15)', goalFill: 'rgba(130,50,200,0.15)', goalStroke: '#8040c0', goalNet: 'rgba(128,64,192,0.3)' },
];
let activeTeams = [0, 1]; // indices into TEAMS, randomized at match start
function teamOf(slot) { return TEAMS[activeTeams[slot]]; }

// ─── NAME POOLS ────────────────────────────────────────
const NAME_POOLS = {
  SWE: {
    initials: 'ABEHJKLMNOPRSTV',
    surnames: ['Lindqvist','Bergström','Johansson','Pettersson','Eriksson','Nyström','Hedman','Forsberg','Sundqvist','Lundin','Bäckström','Karlsson','Nilsson','Zetterberg','Lidström','Sedin','Alfredsson','Nylander','Höglund','Holmström'],
  },
  FIN: {
    initials: 'AEHIJKLMNOPRSTV',
    surnames: ['Koivu','Selänne','Laine','Rantanen','Barkov','Jokinen','Teräväinen','Ristolainen','Granlund','Haula','Räsänen','Salminen','Virtanen','Lehto','Mäkinen','Niskanen','Korpikoski','Filppula','Pulkkinen','Hietanen'],
  },
  RUS: {
    initials: 'ADEVIKMNPSY',
    surnames: ['Ovechkin','Malkin','Kucherov','Panarin','Tarasenko','Vasilevskiy','Svechnikov','Kaprizov','Sergachev','Provorov','Kuznetsov','Radulov','Bobrovsky','Marchenko','Voronov','Fedorov','Bure','Mogilny','Kovalev','Datsyuk'],
  },
  CAN: {
    initials: 'ABCDJKLMNPRST',
    surnames: ['MacDonald','Crosby','Bergeron','Marchand','McDavid','Giroux','Stamkos','Tavares','Toews','MacKinnon','Chabot','Morrissey','Murray','Thompson','Wilson','Roberts','Campbell','Mitchell','Fraser','Henderson'],
  },
  CZE: {
    initials: 'ADFJKLMNOPRTV',
    surnames: ['Jágr','Pastrňák','Voráček','Hertl','Krejčí','Palát','Nečas','Hronek','Chytil','Šimek','Kovář','Zadina','Nosek','Kämpf','Vrána','Zbořil','Sedlák','Flek','Blümel','Rutta'],
  },
  USA: {
    initials: 'ABCDJKMNPRST',
    surnames: ['Kane','Matthews','Tkachuk','Hughes','Eichel','Gaudreau','DeBrincat','Fox','Werenski','Carlson','Miller','Anderson','Johnson','Baker','Clark','Nelson','Peterson','Sullivan','Brady','Murphy'],
  },
};
const NATIONALITIES = Object.keys(NAME_POOLS);

function generateName(nationality) {
  const pool = NAME_POOLS[nationality];
  const initial = pool.initials[Math.floor(Math.random() * pool.initials.length)];
  const surname = pool.surnames[Math.floor(Math.random() * pool.surnames.length)];
  return `${initial}. ${surname}`;
}

// ─── FRANCHISE STATE ────────────────────────────────────
let franchise = null;
let screenState = 'title';
let matchStats = null; // per-match tracking
let puckCarrierHistory = [[], []]; // last carriers per team slot

const LEVEL_THRESHOLDS = [0, 100, 225, 375, 550, 750, 975, 1225, 1500, 1800];
const STAT_NAMES_SKATER = ['speed','shot','pass','check','defense'];
const STAT_NAMES_GOALIE = ['speed','save','positioning'];

const STAT_RANGES = {
  fwd:    { speed: [5,7], shot: [5,7], pass: [4,6], check: [3,5], defense: [3,5] },
  center: { speed: [5,6], shot: [4,6], pass: [6,8], check: [4,6], defense: [4,6] },
  def:    { speed: [4,6], shot: [3,5], pass: [5,7], check: [5,7], defense: [6,8] },
  goalie: { speed: [5,7], save: [5,8], positioning: [5,7] },
};

const AUTO_LEVEL_PRIORITY = {
  fwd:    ['shot','speed','pass','check','defense'],
  center: ['pass','speed','shot','defense','check'],
  def:    ['defense','check','pass','speed','shot'],
  goalie: ['save','positioning','speed'],
};

function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function createRosterForTeam(teamIdx) {
  const nat = NATIONALITIES[Math.floor(Math.random() * NATIONALITIES.length)];
  const roles = ['goalie','def','def','fwd','fwd','center'];
  const roster = [];
  const usedNames = new Set();
  for (const role of roles) {
    const playerNat = Math.random() < 0.9 ? nat : NATIONALITIES[Math.floor(Math.random() * NATIONALITIES.length)];
    let name;
    do { name = generateName(playerNat); } while (usedNames.has(name));
    usedNames.add(name);
    const ranges = STAT_RANGES[role];
    const stats = {};
    for (const [stat, [lo, hi]] of Object.entries(ranges)) {
      stats[stat] = randInt(lo, hi);
    }
    roster.push({ name, role, stats, xp: 0, level: 1, unspentPoints: 0, nationality: playerNat });
  }
  return roster;
}

function createNewFranchise(playerTeamIdx) {
  const rosters = {};
  for (let i = 0; i < TEAMS.length; i++) {
    rosters[i] = createRosterForTeam(i);
  }
  franchise = {
    version: 1,
    playerTeam: playerTeamIdx,
    season: 1,
    schedule: [],
    currentRound: 0,
    standings: {},
    rosters,
    playoffState: null,
    seasonStats: {}, // cumulative goals/assists per player per season
  };
  generateSchedule();
  initStandings();
  initSeasonStats();
  return franchise;
}

// ─── SPRITES ────────────────────────────────────────────
const spriteImages = {};
const SPRITE_NAMES = [
  'player_red', 'player_blue', 'player_green', 'player_yellow', 'player_purple',
  'goalie_red', 'goalie_blue', 'goalie_green', 'goalie_yellow', 'goalie_purple',
  'puck',
];
for (const name of SPRITE_NAMES) {
  const img = new Image();
  img.src = `sprites/${name}.png`;
  img.onload = () => { spriteImages[name] = img; };
}

// ─── SOUNDS ─────────────────────────────────────────────
const SOUND_VOLUMES = {
  shot: 1.0,
  pass: 0.8,
  board: 0.08,
  goal: 0.03,
  whistle: 0.03,
  body_check: 0.8,
};
const sounds = {};
for (const [name, vol] of Object.entries(SOUND_VOLUMES)) {
  const a = new Audio(`sounds/${name}.mp3`);
  a.volume = vol;
  sounds[name] = a;
}
function playSound(name) {
  const s = sounds[name];
  if (!s) return;
  s.currentTime = 0;
  s.play().catch(() => {});
}

function fitCanvas() {
  const pad = 8;
  const topUI = 32;
  const bottomUI = 34;
  const sw = window.innerWidth - pad;
  const sh = window.innerHeight - topUI - bottomUI;
  const cssScale = Math.min(sw / CANVAS_W, sh / H);
  canvas.style.width = (CANVAS_W * cssScale) + 'px';
  canvas.style.height = (H * cssScale) + 'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

let gameSpeed = 1;
function setSpeed(s) {
  gameSpeed = s;
  document.querySelectorAll('#speed-controls button').forEach(b => {
    b.classList.toggle('active', parseFloat(b.textContent) === s);
  });
}

// ─── GAME STATE ─────────────────────────────────────────
const GOAL_W = 36 * S;
const GOAL_DEPTH = 10 * S;
const GOAL_X = (W - GOAL_W) / 2;
const PERIOD_TIME = 90;
const OT_TIME = 60;
const TOTAL_PERIODS = 3;
const PENALTY_DURATION = 30; // game seconds

const PEN_BOX_H = 45 * S; // penalty box height (fits 3 players)
const PEN_BOX_GAP = 6 * S; // gap between the two boxes
const PENALTY_BOX = [
  { x: W + PEN_BOX_W / 2, y: H / 2 - PEN_BOX_GAP / 2 - PEN_BOX_H / 2 },
  { x: W + PEN_BOX_W / 2, y: H / 2 + PEN_BOX_GAP / 2 + PEN_BOX_H / 2 },
];

let state = 'menu'; // menu, playing, faceoff, goal, penalty, periodEnd, gameOver
let score = [0, 0];
let period = 1;
let clock = PERIOD_TIME;
let goalTimer = 0;
let periodEndTimer = 0;
let faceoffTimer = 0;
let faceoffPos = { x: W / 2, y: H / 2 };
let overtime = false;
let puck, players;
let particles = [];
let shakeAmount = 0;
let pendingPenalty = null;
let penaltyDisplayTimer = 0;
let lastPenaltyTeam = -1;

// ─── HELPERS ────────────────────────────────────────────
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function norm(vx, vy) { const l = Math.hypot(vx, vy) || 1; return { x: vx/l, y: vy/l }; }

function defendsTop(team) {
  return (period % 2 === 1) ? (team === 0) : (team === 1);
}

// ─── PARTICLES ─────────────────────────────────────────
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = rand(speed * 0.3, speed);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1.0,
      decay: rand(1.5, 3.0),
      r: rand(1.5, 3.5) * S,
      color,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ─── PUCK ───────────────────────────────────────────────
function makePuck() {
  return { x: W/2, y: H/2, vx: 0, vy: 0, r: 3*S, trail: [] };
}

// ─── PLAYERS ────────────────────────────────────────────
const BASE_FORMATION = [
  { role:'goalie', hx: W/2, hy: 30*S },
  { role:'def', hx: W/2 - 40*S, hy: 100*S },
  { role:'def', hx: W/2 + 40*S, hy: 100*S },
  { role:'fwd', hx: W/2 - 35*S, hy: 220*S },
  { role:'fwd', hx: W/2 + 35*S, hy: 220*S },
  { role:'center', hx: W/2, hy: 170*S },
];

function getTeamPositions(team) {
  const top = defendsTop(team);
  return BASE_FORMATION.map(p => ({
    team,
    role: p.role,
    hx: p.hx,
    hy: top ? p.hy : H - p.hy,
  }));
}

function getPlayerStat(p, stat) {
  if (!p.rosterData) return 5; // fallback
  return p.rosterData.stats[stat] || 5;
}

function makePlayers() {
  const p = [];
  const positions = [...getTeamPositions(0), ...getTeamPositions(1)];
  for (let i = 0; i < positions.length; i++) {
    const p0 = positions[i];
    const teamRealIdx = activeTeams[p0.team];
    const localIdx = i < 6 ? i : i - 6; // index within team roster
    const rosterData = franchise ? franchise.rosters[teamRealIdx][localIdx] : null;
    p.push({
      ...p0,
      x: p0.hx, y: p0.hy,
      vx: 0, vy: 0,
      r: 6 * S,
      hasPuck: false,
      puckShield: 0,
      pickupCooldown: 0,
      shootCooldown: 0,
      holdTimer: 0,
      fatigue: 0,
      facing: defendsTop(p0.team) ? Math.PI / 2 : -Math.PI / 2,
      iceTrail: [],
      penalized: false,
      penaltyTimer: 0,
      shoveCooldown: 0,
      stunTimer: 0,
      rosterData,
      rosterIdx: localIdx,
      goalieTrackX: p0.hx,
    });
  }
  return p;
}

function resetPositions() {
  const positions = [...getTeamPositions(0), ...getTeamPositions(1)];
  players.forEach((p, i) => {
    if (p.penalized) return; // penalized players stay in box
    p.x = positions[i].hx; p.y = positions[i].hy;
    p.hx = positions[i].hx; p.hy = positions[i].hy;
    p.vx = 0; p.vy = 0; p.hasPuck = false;
    p.shootCooldown = 0; p.puckShield = 0; p.pickupCooldown = 0;
    p.iceTrail = [];
  });
  puck.x = W/2; puck.y = H/2; puck.vx = 0; puck.vy = 0; puck.trail = [];
}

// ─── GAME LOOP ──────────────────────────────────────────
let lastTime = 0;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const rawDt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  const dt = rawDt * gameSpeed;

  if (state === 'playing') {
    clock -= dt;
    if (clock <= 0) {
      clock = 0;
      if (period < TOTAL_PERIODS) {
        state = 'periodEnd';
        periodEndTimer = 2.0;
        playSound('whistle');
      } else if (score[0] === score[1]) {
        overtime = true;
        state = 'periodEnd';
        periodEndTimer = 2.0;
        playSound('whistle');
      } else {
        state = 'gameOver';
        playSound('whistle');
      }
    }

    aiUpdate(dt);
    const goalScored = puckUpdate(dt);

    if (goalScored >= 0) {
      score[goalScored]++;
      state = 'goal';
      goalTimer = 2.0;
      shakeAmount = 8 * S;
      showGoalFlash(goalScored);
      const goalColor = teamOf(goalScored).light;
      spawnParticles(puck.x, puck.y, goalColor, 25, 150 * S);
      spawnParticles(puck.x, puck.y, '#ffcc00', 15, 100 * S);
      pendingPenalty = null; // goal overrides pending penalty
      // Track goal & assist
      if (matchStats) {
        const hist = puckCarrierHistory[goalScored];
        if (hist.length > 0) { matchStats[hist[0]].goals++; }
        if (hist.length > 1 && hist[1] !== hist[0]) { matchStats[hist[1]].assists++; }
      }
      puckCarrierHistory = [[], []];
    } else if (pendingPenalty) {
      // Handle pending penalty (no goal in this frame)
      lastPenaltyTeam = pendingPenalty.team;
      faceoffPos = pendingPenalty.faceoffPos;
      state = 'penalty';
      penaltyDisplayTimer = 1.5;
      playSound('whistle');
      // Drop puck
      const c = players.find(pl => pl.hasPuck);
      if (c) { c.hasPuck = false; puck.vx = 0; puck.vy = 0; }
      pendingPenalty = null;
    }
  } else if (state === 'faceoff') {
    faceoffTimer -= rawDt * gameSpeed;
    if (faceoffTimer <= 0) {
      state = 'playing';
    }
  } else if (state === 'goal') {
    goalTimer -= rawDt;
    if (goalTimer <= 0) {
      if (overtime) {
        state = 'gameOver';
      } else {
        faceoffPos = { x: W / 2, y: H / 2 };
        resetPositions();
        state = 'faceoff';
        faceoffTimer = 1.0;
        playSound('whistle');
      }
    }
  } else if (state === 'penalty') {
    penaltyDisplayTimer -= rawDt;
    if (penaltyDisplayTimer <= 0) {
      // Set up target positions for smooth skate-to-position
      const positions = [...getTeamPositions(0), ...getTeamPositions(1)];
      players.forEach((p, i) => {
        if (p.penalized) return;
        p.resetTarget = { x: positions[i].hx, y: positions[i].hy };
        p.hx = positions[i].hx;
        p.hy = positions[i].hy;
        p.hasPuck = false;
        p.shootCooldown = 0; p.puckShield = 0; p.pickupCooldown = 0;
      });
      puck.vx = 0; puck.vy = 0; puck.trail = [];
      state = 'penaltyReset';
    }
  } else if (state === 'penaltyReset') {
    const resetSpeed = 150 * S;
    let allArrived = true;

    for (const p of players) {
      if (p.penalized) {
        // Penalized player skates to penalty box
        const box = PENALTY_BOX[p.team];
        const dx = box.x - p.x;
        const dy = box.y - p.y;
        const d = Math.hypot(dx, dy);
        if (d > 3) {
          allArrived = false;
          p.vx = (dx / d) * 100 * S;
          p.vy = (dy / d) * 100 * S;
        } else {
          p.vx = 0; p.vy = 0;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      } else if (p.resetTarget) {
        const dx = p.resetTarget.x - p.x;
        const dy = p.resetTarget.y - p.y;
        const d = Math.hypot(dx, dy);
        if (d > 3) {
          allArrived = false;
          p.vx = (dx / d) * resetSpeed;
          p.vy = (dy / d) * resetSpeed;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        } else {
          p.x = p.resetTarget.x;
          p.y = p.resetTarget.y;
          p.vx = 0; p.vy = 0;
          delete p.resetTarget;
        }
      }

      // Facing direction & ice trails during reset
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 20 * S) p.facing = Math.atan2(p.vy, p.vx);
      if (sp > 30 * S) {
        p.iceTrail.push({ x: p.x, y: p.y });
        if (p.iceTrail.length > 40) p.iceTrail.shift();
      }
    }

    // Slide puck to faceoff position
    const pdx = faceoffPos.x - puck.x;
    const pdy = faceoffPos.y - puck.y;
    const pd = Math.hypot(pdx, pdy);
    if (pd > 3) {
      allArrived = false;
      puck.x += (pdx / pd) * resetSpeed * dt;
      puck.y += (pdy / pd) * resetSpeed * dt;
    } else {
      puck.x = faceoffPos.x;
      puck.y = faceoffPos.y;
    }

    if (allArrived) {
      players.forEach(p => delete p.resetTarget);
      puck.x = faceoffPos.x;
      puck.y = faceoffPos.y;
      puck.vx = 0; puck.vy = 0;
      state = 'faceoff';
      faceoffTimer = 1.0;
    }
  } else if (state === 'periodEnd') {
    periodEndTimer -= rawDt;
    if (periodEndTimer <= 0) {
      period++;
      clock = overtime ? OT_TIME : PERIOD_TIME;
      faceoffPos = { x: W / 2, y: H / 2 };
      resetPositions();
      state = 'faceoff';
      faceoffTimer = 1.0;
      playSound('whistle');
    }
  }

  // Update particles always
  updateParticles(rawDt);

  // Screen shake
  let shakeX = 0, shakeY = 0;
  if (shakeAmount > 0.5) {
    shakeX = (Math.random() - 0.5) * shakeAmount;
    shakeY = (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.88;
  }

  // Draw with shake
  ctx.save();
  ctx.translate(RINK_X + shakeX, shakeY);
  ctx.imageSmoothingEnabled = false;
  drawRink();
  if (players && puck) {
    drawIceTrails();
    drawPlayers();
    drawPuck();
  }
  drawParticles();
  ctx.restore();

  // UI (no shake)
  ctx.save();
  ctx.translate(RINK_X, 0);
  drawUI();
  drawOverlays();
  ctx.restore();
}

function pickRandomTeams() {
  const a = Math.floor(Math.random() * TEAMS.length);
  let b = Math.floor(Math.random() * (TEAMS.length - 1));
  if (b >= a) b++;
  activeTeams = [a, b];
  // Update scoreboard dots
  document.getElementById('dot-0').style.background = teamOf(0).dot;
  document.getElementById('dot-1').style.background = teamOf(1).dot;
}

function startMatch(team0Idx, team1Idx) {
  activeTeams = [team0Idx, team1Idx];
  document.getElementById('dot-0').style.background = teamOf(0).dot;
  document.getElementById('dot-1').style.background = teamOf(1).dot;
  score = [0, 0];
  period = 1;
  clock = PERIOD_TIME;
  overtime = false;
  particles = [];
  shakeAmount = 0;
  pendingPenalty = null;
  faceoffPos = { x: W / 2, y: H / 2 };
  puck = makePuck();
  players = makePlayers();
  puckCarrierHistory = [[], []];
  matchStats = [];
  for (let i = 0; i < players.length; i++) {
    matchStats[i] = { goals: 0, assists: 0, bodyChecks: 0 };
  }
  state = 'faceoff';
  faceoffTimer = 1.0;
  document.getElementById('franchise-screen').classList.add('hidden');
  document.getElementById('msg-overlay').classList.add('hidden');
}

canvas.addEventListener('click', () => {
  if (state === 'gameOver' && franchise) {
    if (franchise.playoffState && franchise.playoffState.stage !== 'done') {
      onPlayoffMatchEnd();
    } else {
      onMatchEnd();
    }
  }
});

// ─── GAME OVER HOOK ────────────────────────────────────
// Override game-over behavior: instead of restarting, go to post-match
const origGameLoop = null; // handled inline in gameLoop

// ─── STARTUP ───────────────────────────────────────────
state = 'menu';
screenState = 'title';
renderFranchiseScreen();
requestAnimationFrame(gameLoop);
</script>
