<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Hockey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a1a;
    font-family: 'Press Start 2P', monospace;
  }
  #game-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  #scoreboard {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 6px 0; color: #fff; font-size: 11px; letter-spacing: 1px;
    width: 100%; max-width: 420px;
  }
  .team-score { display: flex; align-items: center; gap: 6px; }
  .team-dot { width: 10px; height: 10px; border-radius: 2px; }
  .red { background: #e04040; }
  .blue { background: #4080e0; }
  #period-info { color: #8888aa; font-size: 9px; }
  #game-time { color: #ffcc00; font-size: 13px; font-weight: bold; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid #334;
    border-radius: 4px;
  }
  #msg-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,5,20,0.85); color: #fff; z-index: 10;
    font-family: 'Press Start 2P', monospace; text-align: center;
    pointer-events: auto; cursor: pointer;
  }
  #msg-overlay.hidden { display: none; }
  #msg-overlay h1 { font-size: 18px; color: #ffcc00; margin-bottom: 16px; text-shadow: 2px 2px #000; }
  #msg-overlay p { font-size: 10px; color: #aaa; line-height: 1.8; }
  #goal-flash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center;
    z-index: 5; pointer-events: none;
  }
  #goal-flash span {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px; text-shadow: 3px 3px #000;
    animation: goalPulse 0.6s ease-out;
  }
  @keyframes goalPulse {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #speed-controls {
    display: flex; gap: 8px; margin-top: 6px;
  }
  #speed-controls button {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; padding: 4px 10px;
    background: #1a1a2e; color: #8888aa; border: 1px solid #334;
    border-radius: 3px; cursor: pointer;
  }
  #speed-controls button.active {
    color: #ffcc00; border-color: #ffcc00;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="scoreboard">
    <div class="team-score"><div class="team-dot red"></div><span id="score-red">0</span></div>
    <span id="period-info">P1</span>
    <span id="game-time">20:00</span>
    <div class="team-score"><span id="score-blue">0</span><div class="team-dot blue"></div></div>
  </div>
  <canvas id="c"></canvas>
  <div id="speed-controls">
    <button onclick="setSpeed(0.5)">0.5x</button>
    <button class="active" onclick="setSpeed(1)">1x</button>
    <button onclick="setSpeed(2)">2x</button>
    <button onclick="setSpeed(3)">3x</button>
  </div>
</div>

<div id="msg-overlay" onclick="startGame()">
  <h1>🏒 PIXEL HOCKEY</h1>
  <p>RED vs BLUE<br><br>3 Perioder × 2 min<br><br>Tryck för att starta!</p>
</div>
<div id="goal-flash"><span>GOAL!</span></div>

<script>
// ─── CONFIG ─────────────────────────────────────────────
const RINK_W = 240;
const RINK_H = 400;
const S = 2;
const W = RINK_W * S;
const H = RINK_H * S;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ─── SPRITES ────────────────────────────────────────────
const spriteImages = {};
const SPRITE_NAMES = ['player_red', 'player_blue', 'goalie_red', 'goalie_blue', 'puck'];
for (const name of SPRITE_NAMES) {
  const img = new Image();
  img.src = `sprites/${name}.png`;
  img.onload = () => { spriteImages[name] = img; };
}

function fitCanvas() {
  const pad = 8;
  const topUI = 32;
  const bottomUI = 34;
  const sw = window.innerWidth - pad;
  const sh = window.innerHeight - topUI - bottomUI;
  const cssScale = Math.min(sw / W, sh / H);
  canvas.style.width = (W * cssScale) + 'px';
  canvas.style.height = (H * cssScale) + 'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

let gameSpeed = 1;
function setSpeed(s) {
  gameSpeed = s;
  document.querySelectorAll('#speed-controls button').forEach(b => {
    b.classList.toggle('active', parseFloat(b.textContent) === s);
  });
}

// ─── GAME STATE ─────────────────────────────────────────
const GOAL_W = 36 * S;
const GOAL_DEPTH = 10 * S;
const GOAL_X = (W - GOAL_W) / 2;
const PERIOD_TIME = 120;
const OT_TIME = 60;
const TOTAL_PERIODS = 3;

let state = 'menu'; // menu, playing, faceoff, goal, periodEnd, gameOver
let score = [0, 0];
let period = 1;
let clock = PERIOD_TIME;
let goalTimer = 0;
let periodEndTimer = 0;
let faceoffTimer = 0;
let overtime = false;
let puck, players;
let particles = [];

// ─── HELPERS ────────────────────────────────────────────
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function norm(vx, vy) { const l = Math.hypot(vx, vy) || 1; return { x: vx/l, y: vy/l }; }

// Returns true if this team defends the top goal this period
function defendsTop(team) {
  return (period % 2 === 1) ? (team === 0) : (team === 1);
}

// ─── PARTICLES ─────────────────────────────────────────
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = rand(speed * 0.3, speed);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1.0,
      decay: rand(1.5, 3.0),
      r: rand(1.5, 3.5) * S,
      color,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── PUCK ───────────────────────────────────────────────
function makePuck() {
  return { x: W/2, y: H/2, vx: 0, vy: 0, r: 3*S, trail: [] };
}

// ─── PLAYERS ────────────────────────────────────────────
const BASE_FORMATION = [
  { role:'goalie', hx: W/2, hy: 30*S },
  { role:'def', hx: W/2 - 40*S, hy: 100*S },
  { role:'def', hx: W/2 + 40*S, hy: 100*S },
  { role:'fwd', hx: W/2 - 35*S, hy: 220*S },
  { role:'fwd', hx: W/2 + 35*S, hy: 220*S },
  { role:'center', hx: W/2, hy: 170*S },
];

function getTeamPositions(team) {
  const top = defendsTop(team);
  return BASE_FORMATION.map(p => ({
    team,
    role: p.role,
    hx: p.hx,
    hy: top ? p.hy : H - p.hy,
  }));
}

function makePlayers() {
  const p = [];
  const positions = [...getTeamPositions(0), ...getTeamPositions(1)];
  for (const p0 of positions) {
    p.push({
      ...p0,
      x: p0.hx, y: p0.hy,
      vx: 0, vy: 0,
      r: 6 * S,
      hasPuck: false,
      puckShield: 0,
      pickupCooldown: 0,
      shootCooldown: 0,
      holdTimer: 0,
      fatigue: 0,
    });
  }
  return p;
}

function resetPositions() {
  const positions = [...getTeamPositions(0), ...getTeamPositions(1)];
  players.forEach((p, i) => {
    p.x = positions[i].hx; p.y = positions[i].hy;
    p.hx = positions[i].hx; p.hy = positions[i].hy;
    p.vx = 0; p.vy = 0; p.hasPuck = false;
    p.shootCooldown = 0; p.puckShield = 0; p.pickupCooldown = 0;
  });
  puck.x = W/2; puck.y = H/2; puck.vx = 0; puck.vy = 0; puck.trail = [];
}

// ─── AI ─────────────────────────────────────────────────
function aiUpdate(dt) {
  const carrier = players.find(p => p.hasPuck);

  for (const p of players) {
    let tx = p.hx, ty = p.hy;
    const spd = p.role === 'goalie' ? 110 * S : 130 * S;
    const defTop = defendsTop(p.team);
    const attackDir = defTop ? 1 : -1;
    const ownGoalY = defTop ? 0 : H;
    const oppGoalY = defTop ? H : 0;

    p.shootCooldown = Math.max(0, p.shootCooldown - dt);
    p.puckShield = Math.max(0, p.puckShield - dt);
    p.pickupCooldown = Math.max(0, p.pickupCooldown - dt);

    if (p.hasPuck) {
      if (p.role === 'goalie') {
        // Goalie: pass to best teammate IMMEDIATELY
        const target = bestGoaliePassTarget(p);
        if (target) {
          const lead = getPassLead(p, target);
          const n = norm(lead.x - p.x, lead.y - p.y);
          const aimDist = dist(p, lead);
          const power = clamp(aimDist * 0.85, 100 * S, 230 * S);
          puck.vx = n.x * power;
          puck.vy = n.y * power;
          p.hasPuck = false;
          p.shootCooldown = 0.3;
          p.pickupCooldown = 0.6;
        }
        // Stay near own goal while holding
        tx = clamp(puck.x, GOAL_X + 10*S, GOAL_X + GOAL_W - 10*S);
        ty = ownGoalY + (defTop ? 25*S : -25*S);
      } else {
        // Has puck: track how long we've held it
        p.holdTimer += dt;

        const goalX = W / 2;
        const goalY = oppGoalY;
        const dg = dist(p, { x: goalX, y: goalY });

        // Shoot if close enough
        if (dg < 110 * S && p.shootCooldown <= 0) {
          const n = norm(goalX - p.x + rand(-20*S, 20*S), goalY - p.y);
          puck.vx = n.x * 320 * S;
          puck.vy = n.y * 320 * S;
          p.hasPuck = false;
          p.shootCooldown = 1.0;
          p.pickupCooldown = 0.6;
          p.holdTimer = 0;
          // Shot particles
          spawnParticles(puck.x, puck.y, '#ffcc00', 8, 80 * S);
        } else {
          // Skate toward goal
          tx = goalX + Math.sin(Date.now() * 0.003 + p.hx) * 40 * S;
          ty = p.y + attackDir * 50 * S;

          // PASSING: main play mechanic
          const nearestOpp = closestOpponent(p);
          const oppDist = nearestOpp ? dist(p, nearestOpp) : 999;
          const teammate = bestPassTarget(p);

          if (teammate) {
            let doPass = false;

            // Time-based: must pass after holding a while
            if (p.holdTimer > 2.5) doPass = true;
            // Pressured: pass if held long enough
            if (oppDist < 35 * S && p.holdTimer > 0.8) doPass = true;
            if (oppDist < 20 * S && p.holdTimer > 0.4) doPass = true;
            // Defenders pass forward after a beat
            if (p.role === 'def' && p.holdTimer > 1.2) doPass = true;
            // Random proactive pass occasionally
            if (p.holdTimer > 1.0 && Math.random() < 0.015) doPass = true;

            if (doPass && p.shootCooldown <= 0) {
              const lead = getPassLead(p, teammate);
              const n = norm(lead.x - p.x, lead.y - p.y);
              const aimDist = dist(p, lead);
              const power = clamp(aimDist * 0.85, 100 * S, 230 * S);
              puck.vx = n.x * power;
              puck.vy = n.y * power;
              p.hasPuck = false;
              p.shootCooldown = 0.3;
              p.pickupCooldown = 0.6;
              p.holdTimer = 0;
            }
          }
        }
      }
    } else if (carrier && carrier.team === p.team) {
      p.holdTimer = 0;
      // Teammate has puck: spread out WIDE into passing lanes
      if (p.role === 'goalie') {
        tx = clamp(puck.x, GOAL_X + 10*S, GOAL_X + GOAL_W - 10*S);
        ty = ownGoalY + (defTop ? 20*S : -20*S);
      } else if (p.role === 'def') {
        // Defenders: wide and behind, safe outlet pass
        const side = (p.hx < W/2) ? -1 : 1;
        tx = W/2 + side * 80 * S;
        ty = carrier.y - attackDir * 70 * S;
        ty = clamp(ty, 35*S, H - 35*S);
      } else if (p.role === 'fwd') {
        // Forwards: push FAR ahead and to opposite wings
        const side = (p.hx < W/2) ? -1 : 1;
        tx = W/2 + side * 75 * S;
        ty = carrier.y + attackDir * 90 * S;
        ty = clamp(ty, 35*S, H - 35*S);
      } else {
        // Center: middle lane, ahead of carrier on opposite side
        const carrierSide = carrier.x < W/2 ? 1 : -1;
        tx = W/2 + carrierSide * 20 * S;
        ty = carrier.y + attackDir * 50 * S;
        ty = clamp(ty, 35*S, H - 35*S);
      }
      // Jitter to stay alive
      tx += Math.sin(Date.now() * 0.003 + p.hx * 0.1) * 12 * S;
    } else if (carrier && carrier.team !== p.team) {
      p.holdTimer = 0;
      // Opponent has puck: only closest chases, rest hold zones
      if (p.role === 'goalie') {
        tx = clamp(puck.x, GOAL_X + 10*S, GOAL_X + GOAL_W - 10*S);
        ty = ownGoalY + (defTop ? 20*S : -20*S);
      } else {
        const closest = closestToPuck(p.team);
        if (p === closest) {
          // Only this one chases
          tx = puck.x + puck.vx * 0.15;
          ty = puck.y + puck.vy * 0.15;
        } else if (p.role === 'def') {
          // Defenders: stay between puck and own goal, spread wide
          const side = (p.hx < W/2) ? -1 : 1;
          tx = W/2 + side * 55 * S;
          const midY = (puck.y + ownGoalY) / 2;
          ty = clamp(midY, defTop ? 50*S : H - 180*S, defTop ? 180*S : H - 50*S);
        } else {
          // Forwards/center: cut off passing lanes, stay in mid zones
          const side = (p.hx < W/2) ? -1 : 1;
          tx = clamp(puck.x + side * 50 * S, 30*S, W - 30*S);
          ty = p.hy + (puck.y - H/2) * 0.3;
          ty = clamp(ty, 50*S, H - 50*S);
        }
      }
    } else {
      // Loose puck
      if (p.role === 'goalie') {
        tx = clamp(puck.x, GOAL_X + 10*S, GOAL_X + GOAL_W - 10*S);
        ty = ownGoalY + (defTop ? 20*S : -20*S);
      } else {
        const closest = closestToPuck(p.team);
        if (p === closest) {
          tx = puck.x; ty = puck.y;
        } else {
          tx = p.hx; ty = p.hy;
        }
      }
    }

    // Goalie constraints
    if (p.role === 'goalie') {
      const gyMin = defTop ? 8*S : H - 45*S;
      const gyMax = defTop ? 45*S : H - 8*S;
      ty = clamp(ty, gyMin, gyMax);
      tx = clamp(tx, GOAL_X - 5*S, GOAL_X + GOAL_W + 5*S);
    }

    // Move toward target
    const dx = tx - p.x;
    const dy = ty - p.y;
    const d = Math.hypot(dx, dy);
    if (d > 2) {
      const acc = spd * 4;
      p.vx += (dx / d) * acc * dt;
      p.vy += (dy / d) * acc * dt;
    }

    // SEPARATION: repel from nearby teammates to prevent clumping
    if (p.role !== 'goalie') {
      for (const other of players) {
        if (other === p || other.team !== p.team || other.role === 'goalie') continue;
        const sep = dist(p, other);
        const minSep = 55 * S;
        if (sep < minSep && sep > 0) {
          const pushStr = (minSep - sep) / minSep * spd * 3.5;
          const nx = (p.x - other.x) / sep;
          const ny = (p.y - other.y) / sep;
          p.vx += nx * pushStr * dt;
          p.vy += ny * pushStr * dt;
        }
      }
    }

    // Friction
    const fric = 0.92;
    p.vx *= fric; p.vy *= fric;

    // Speed limit
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > spd) { p.vx *= spd/sp; p.vy *= spd/sp; }

    // Move
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // Rink bounds
    const margin = p.r;
    p.x = clamp(p.x, margin, W - margin);
    p.y = clamp(p.y, margin, H - margin);

    // Pick up puck (blocked by pickupCooldown)
    if (!carrier && !p.hasPuck && p.pickupCooldown <= 0 && dist(p, puck) < p.r + puck.r + 2*S) {
      if (Math.hypot(puck.vx, puck.vy) < 200 * S || Math.random() < 0.4) {
        p.hasPuck = true;
        p.holdTimer = 0;
        p.puckShield = 0.5;
        puck.vx = 0; puck.vy = 0;
        if (p.role === 'goalie') p.shootCooldown = 0;
      }
    }

    // Body check - steal puck (NEVER on goalies, blocked by shield)
    if (carrier && carrier.team !== p.team && carrier.puckShield <= 0 && carrier.role !== 'goalie' && p.role !== 'goalie' && dist(p, carrier) < p.r * 2.2) {
      if (Math.random() < 0.12) {
        carrier.hasPuck = false;
        carrier.pickupCooldown = 0.6;
        puck.vx = rand(-60, 60) * S;
        puck.vy = rand(-60, 60) * S;
        // Body check particles
        spawnParticles(carrier.x, carrier.y, '#fff', 6, 60 * S);
      }
    }

    // Crease avoidance — opponents stay out of goalie crease
    if (p.role !== 'goalie') {
      const creaseR = 30 * S;
      const topDefTeam = defendsTop(0) ? 0 : 1;
      // Top crease
      if (p.team !== topDefTeam) {
        const dc = Math.hypot(p.x - W/2, p.y);
        if (dc < creaseR) {
          const cn = norm(p.x - W/2, p.y);
          p.x = W/2 + cn.x * creaseR;
          p.y = cn.y * creaseR;
        }
      }
      // Bottom crease
      if (p.team !== (1 - topDefTeam)) {
        const dc = Math.hypot(p.x - W/2, p.y - H);
        if (dc < creaseR) {
          const cn = norm(p.x - W/2, p.y - H);
          p.x = W/2 + cn.x * creaseR;
          p.y = H + cn.y * creaseR;
        }
      }
    }
  }

  // Player-player collision (goalies get extra push protection)
  for (let i = 0; i < players.length; i++) {
    for (let j = i+1; j < players.length; j++) {
      const a = players[i], b = players[j];
      const d = dist(a, b);
      const minD = a.r + b.r;
      if (d < minD && d > 0) {
        const nx = (b.x - a.x) / d;
        const ny = (b.y - a.y) / d;
        const overlap = (minD - d) / 2;
        const aIsGoalie = a.role === 'goalie';
        const bIsGoalie = b.role === 'goalie';
        if (aIsGoalie) {
          b.x += nx * overlap * 2; b.y += ny * overlap * 2;
        } else if (bIsGoalie) {
          a.x -= nx * overlap * 2; a.y -= ny * overlap * 2;
        } else {
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
        }
        if ((aIsGoalie && b.team !== a.team) || (bIsGoalie && a.team !== b.team)) {
          const pushF = 1.2;
          if (aIsGoalie) { b.vx += nx * pushF; b.vy += ny * pushF; }
          else { a.vx -= nx * pushF; a.vy -= ny * pushF; }
        } else {
          const dvx = a.vx - b.vx;
          const dvy = a.vy - b.vy;
          const dot = dvx * nx + dvy * ny;
          a.vx -= dot * nx * 0.5;
          a.vy -= dot * ny * 0.5;
          b.vx += dot * nx * 0.5;
          b.vy += dot * ny * 0.5;
        }
      }
    }
  }
}

function closestOpponent(p) {
  let best = null, bestD = Infinity;
  for (const o of players) {
    if (o.team === p.team) continue;
    const d = dist(p, o);
    if (d < bestD) { bestD = d; best = o; }
  }
  return best;
}

function closestToPuck(team) {
  let best = null, bestD = Infinity;
  for (const p of players) {
    if (p.team !== team || p.role === 'goalie') continue;
    const d = dist(p, puck);
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

// Check if passing lane from→to is clear of opponents
function passingLaneClear(from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const len = Math.hypot(dx, dy);
  if (len < 1) return false;
  const nx = dx / len;
  const ny = dy / len;
  for (const opp of players) {
    if (opp.team === from.team) continue;
    const ox = opp.x - from.x;
    const oy = opp.y - from.y;
    const proj = ox * nx + oy * ny;
    if (proj < 20 * S || proj > len - 10 * S) continue; // behind passer or past target
    const perp = Math.abs(-ny * ox + nx * oy);
    if (perp < 25 * S) return false;
  }
  return true;
}

// Compute where teammate will be when a pass arrives
function getPassLead(from, teammate) {
  const d = dist(from, teammate);
  const passSpeed = clamp(d * 0.85, 100 * S, 230 * S);
  const travelTime = d / passSpeed;
  return {
    x: teammate.x + teammate.vx * travelTime,
    y: teammate.y + teammate.vy * travelTime,
  };
}

function bestPassTarget(carrier) {
  let best = null, bestScore = -Infinity;
  const attackDir = defendsTop(carrier.team) ? 1 : -1;
  for (const p of players) {
    if (p === carrier || p.team !== carrier.team || p.role === 'goalie') continue;
    const d = dist(p, carrier);
    const lead = getPassLead(carrier, p);
    const ahead = (lead.y - carrier.y) * attackDir;

    let sc = 0;
    if (ahead > 0) sc += ahead * 2.0;
    else sc += ahead * 0.3;

    if (d > 50 * S && d < 150 * S) sc += 60;
    if (d < 30 * S) sc -= 80;
    if (d > 200 * S) sc -= 40;

    const nearOpp = closestOpponent(p);
    if (nearOpp) {
      const oppD = dist(p, nearOpp);
      if (oppD > 50 * S) sc += 60;
      else if (oppD > 30 * S) sc += 20;
      else if (oppD < 15 * S) sc -= 60;
    }

    // Passing lane blocked = heavy penalty
    if (!passingLaneClear(carrier, lead)) sc -= 120;

    if (p.role === 'fwd') sc += 25;

    if (sc > bestScore) { bestScore = sc; best = p; }
  }
  return best;
}

function bestGoaliePassTarget(goalie) {
  let best = null, bestScore = -Infinity;
  for (const p of players) {
    if (p === goalie || p.team !== goalie.team || p.role === 'goalie') continue;
    const d = dist(goalie, p);
    let sc = -d * 0.5;
    if (p.role === 'def') sc += 80 * S;
    if (p.role === 'center') sc += 50 * S;
    const nearestOppToTarget = closestOpponent(p);
    if (nearestOppToTarget && dist(p, nearestOppToTarget) < 25 * S) sc -= 60 * S;
    if (sc > bestScore) { bestScore = sc; best = p; }
  }
  return best;
}

// ─── PHYSICS ────────────────────────────────────────────
function puckUpdate(dt) {
  const carrier = players.find(p => p.hasPuck);
  if (carrier) {
    const stickOffset = defendsTop(carrier.team) ? 6*S : -6*S;
    puck.x = carrier.x;
    puck.y = carrier.y + stickOffset;
    puck.vx = 0; puck.vy = 0;
  } else {
    // Friction
    puck.vx *= 0.995;
    puck.vy *= 0.995;
    puck.x += puck.vx * dt;
    puck.y += puck.vy * dt;

    // Wall bounce
    if (puck.x < puck.r) { puck.x = puck.r; puck.vx = Math.abs(puck.vx) * 0.8; }
    if (puck.x > W - puck.r) { puck.x = W - puck.r; puck.vx = -Math.abs(puck.vx) * 0.8; }

    // Goal check top
    if (puck.y < GOAL_DEPTH) {
      if (puck.x > GOAL_X && puck.x < GOAL_X + GOAL_W) {
        // Whoever does NOT defend top scores
        return defendsTop(0) ? 1 : 0;
      } else {
        puck.y = GOAL_DEPTH; puck.vy = Math.abs(puck.vy) * 0.8;
      }
    }
    // Goal check bottom
    if (puck.y > H - GOAL_DEPTH) {
      if (puck.x > GOAL_X && puck.x < GOAL_X + GOAL_W) {
        // Whoever does NOT defend bottom scores
        return defendsTop(0) ? 0 : 1;
      } else {
        puck.y = H - GOAL_DEPTH; puck.vy = -Math.abs(puck.vy) * 0.8;
      }
    }

    // Puck-player deflection (skip players on pickup cooldown)
    for (const p of players) {
      if (p.pickupCooldown > 0) continue;
      const d = dist(p, puck);
      if (d < p.r + puck.r && !p.hasPuck) {
        const nx = (puck.x - p.x) / d;
        const ny = (puck.y - p.y) / d;
        // FIX: save speed before modifying components
        const pSpeed = Math.hypot(puck.vx, puck.vy);
        puck.vx = nx * pSpeed * 0.6 + p.vx * 0.3;
        puck.vy = ny * pSpeed * 0.6 + p.vy * 0.3;
        puck.x = p.x + nx * (p.r + puck.r + 1);
        puck.y = p.y + ny * (p.r + puck.r + 1);
      }
    }
  }

  // Trail
  puck.trail.push({ x: puck.x, y: puck.y });
  if (puck.trail.length > 8) puck.trail.shift();

  return -1;
}

// ─── DRAWING ────────────────────────────────────────────
function drawRink() {
  const topIsRed = defendsTop(0);

  // Ice
  ctx.fillStyle = '#dde8f0';
  ctx.fillRect(0, 0, W, H);

  // Subtle ice texture
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 60; i++) {
    ctx.fillStyle = i % 2 ? '#fff' : '#b0c0d0';
    ctx.fillRect(Math.random()*W, Math.random()*H, rand(20,80)*S, 1);
  }
  ctx.globalAlpha = 1;

  // Rink border
  ctx.strokeStyle = '#556';
  ctx.lineWidth = 3 * S;
  const cr = 20 * S;
  ctx.beginPath();
  ctx.moveTo(cr, 0);
  ctx.lineTo(W - cr, 0);
  ctx.arcTo(W, 0, W, cr, cr);
  ctx.lineTo(W, H - cr);
  ctx.arcTo(W, H, W - cr, H, cr);
  ctx.lineTo(cr, H);
  ctx.arcTo(0, H, 0, H - cr, cr);
  ctx.lineTo(0, cr);
  ctx.arcTo(0, 0, cr, 0, cr);
  ctx.stroke();

  // Center line
  ctx.strokeStyle = '#c04040';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.moveTo(0, H/2);
  ctx.lineTo(W, H/2);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(W/2, H/2, 30*S, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(W/2, H/2, 3*S, 0, Math.PI * 2);
  ctx.fillStyle = '#c04040';
  ctx.fill();

  // Blue lines
  ctx.strokeStyle = '#3060c0';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.3);
  ctx.lineTo(W, H * 0.3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, H * 0.7);
  ctx.lineTo(W, H * 0.7);
  ctx.stroke();

  // Face-off circles
  const faceoffs = [
    [W*0.25, H*0.2], [W*0.75, H*0.2],
    [W*0.25, H*0.8], [W*0.75, H*0.8],
  ];
  ctx.strokeStyle = '#c04040';
  ctx.lineWidth = 1 * S;
  for (const [fx, fy] of faceoffs) {
    ctx.beginPath();
    ctx.arc(fx, fy, 16*S, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(fx, fy, 2*S, 0, Math.PI*2);
    ctx.fillStyle = '#c04040';
    ctx.fill();
  }

  // Goals — colors follow which team defends which end
  const topGoal = topIsRed
    ? { fill: 'rgba(200,50,50,0.15)', stroke: '#c04040', net: 'rgba(192,64,64,0.3)' }
    : { fill: 'rgba(50,80,200,0.15)', stroke: '#3060c0', net: 'rgba(48,96,192,0.3)' };
  const botGoal = topIsRed
    ? { fill: 'rgba(50,80,200,0.15)', stroke: '#3060c0', net: 'rgba(48,96,192,0.3)' }
    : { fill: 'rgba(200,50,50,0.15)', stroke: '#c04040', net: 'rgba(192,64,64,0.3)' };

  // Top goal
  ctx.fillStyle = topGoal.fill;
  ctx.fillRect(GOAL_X, 0, GOAL_W, GOAL_DEPTH);
  ctx.strokeStyle = topGoal.stroke;
  ctx.lineWidth = 2 * S;
  ctx.strokeRect(GOAL_X, 0, GOAL_W, GOAL_DEPTH);
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(GOAL_X + i * GOAL_W/4, 0);
    ctx.lineTo(GOAL_X + i * GOAL_W/4, GOAL_DEPTH);
    ctx.strokeStyle = topGoal.net;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Bottom goal
  ctx.fillStyle = botGoal.fill;
  ctx.fillRect(GOAL_X, H - GOAL_DEPTH, GOAL_W, GOAL_DEPTH);
  ctx.strokeStyle = botGoal.stroke;
  ctx.lineWidth = 2 * S;
  ctx.strokeRect(GOAL_X, H - GOAL_DEPTH, GOAL_W, GOAL_DEPTH);
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(GOAL_X + i * GOAL_W/4, H - GOAL_DEPTH);
    ctx.lineTo(GOAL_X + i * GOAL_W/4, H);
    ctx.strokeStyle = botGoal.net;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Crease arcs
  ctx.strokeStyle = topGoal.stroke;
  ctx.lineWidth = 1.5 * S;
  ctx.beginPath();
  ctx.arc(W/2, 0, 26*S, 0, Math.PI);
  ctx.stroke();
  ctx.strokeStyle = botGoal.stroke;
  ctx.beginPath();
  ctx.arc(W/2, H, 26*S, Math.PI, Math.PI * 2);
  ctx.stroke();
}

function drawPlayers() {
  for (const p of players) {
    const isCarrier = p.hasPuck;
    const spriteName = p.role === 'goalie'
      ? (p.team === 0 ? 'goalie_red' : 'goalie_blue')
      : (p.team === 0 ? 'player_red' : 'player_blue');
    const sprite = spriteImages[spriteName];
    const size = p.r * 2.5;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(p.x + 2*S, p.y + 2*S, p.r, p.r * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();

    if (sprite) {
      ctx.drawImage(sprite, p.x - size / 2, p.y - size / 2, size, size);
    } else {
      // Fallback circles while sprites load
      const colors = p.team === 0
        ? { body: '#d03030', outline: '#901818', helmet: '#ff5050' }
        : { body: '#2060d0', outline: '#103080', helmet: '#50a0ff' };
      ctx.fillStyle = colors.body;
      ctx.strokeStyle = colors.outline;
      ctx.lineWidth = 1.5 * S;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = colors.helmet;
      ctx.beginPath();
      ctx.arc(p.x, p.y - 1.5*S, p.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
      if (p.role === 'goalie') {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${5*S}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('G', p.x, p.y + 1*S);
      }
    }

    // Carrier indicator
    if (isCarrier) {
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 1.5 * S;
      ctx.setLineDash([3*S, 3*S]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 3*S, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawPuck() {
  // Trail
  for (let i = 0; i < puck.trail.length; i++) {
    const t = puck.trail[i];
    const alpha = (i / puck.trail.length) * 0.3;
    ctx.fillStyle = `rgba(20,20,20,${alpha})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, puck.r * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // Puck
  const puckSprite = spriteImages['puck'];
  if (puckSprite) {
    const ps = puck.r * 2.5;
    ctx.drawImage(puckSprite, puck.x - ps / 2, puck.y - ps / 2, ps, ps);
  } else {
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(puck.x - 1*S, puck.y - 1*S, puck.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawUI() {
  document.getElementById('score-red').textContent = score[0];
  document.getElementById('score-blue').textContent = score[1];
  if (overtime) {
    const otNum = period - TOTAL_PERIODS;
    document.getElementById('period-info').textContent = otNum > 1 ? `OT${otNum}` : 'OT';
  } else {
    document.getElementById('period-info').textContent = `P${period}`;
  }
  const mins = Math.floor(clock / 60);
  const secs = Math.floor(clock % 60);
  document.getElementById('game-time').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
}

// ─── GAME LOOP ──────────────────────────────────────────
let lastTime = 0;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const rawDt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  const dt = rawDt * gameSpeed;

  if (state === 'playing') {
    clock -= dt;
    if (clock <= 0) {
      clock = 0;
      if (period < TOTAL_PERIODS) {
        state = 'periodEnd';
        periodEndTimer = 2.0;
      } else if (score[0] === score[1]) {
        // Tied after regulation or OT period — go to (another) overtime
        overtime = true;
        state = 'periodEnd';
        periodEndTimer = 2.0;
      } else {
        state = 'gameOver';
      }
    }

    aiUpdate(dt);
    const goalScored = puckUpdate(dt);
    if (goalScored >= 0) {
      score[goalScored]++;
      state = 'goal';
      goalTimer = 2.0;
      showGoalFlash(goalScored);
      // Goal particles
      const goalColor = goalScored === 0 ? '#ff5050' : '#50a0ff';
      spawnParticles(puck.x, puck.y, goalColor, 25, 150 * S);
      spawnParticles(puck.x, puck.y, '#ffcc00', 15, 100 * S);
    }
  } else if (state === 'faceoff') {
    faceoffTimer -= rawDt * gameSpeed;
    if (faceoffTimer <= 0) {
      state = 'playing';
    }
  } else if (state === 'goal') {
    goalTimer -= rawDt;
    if (goalTimer <= 0) {
      if (overtime) {
        state = 'gameOver';
      } else {
        resetPositions();
        state = 'faceoff';
        faceoffTimer = 1.0;
      }
    }
  } else if (state === 'periodEnd') {
    periodEndTimer -= rawDt;
    if (periodEndTimer <= 0) {
      period++;
      clock = overtime ? OT_TIME : PERIOD_TIME;
      resetPositions();
      state = 'faceoff';
      faceoffTimer = 1.0;
    }
  }

  // Update particles always
  updateParticles(rawDt);

  // Draw
  ctx.imageSmoothingEnabled = false;
  drawRink();
  drawPlayers();
  drawPuck();
  drawParticles();
  drawUI();

  // Faceoff indicator
  if (state === 'faceoff') {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.008);
    ctx.strokeStyle = `rgba(255, 204, 0, ${pulse})`;
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.arc(W/2, H/2, 12 * S + pulse * 5 * S, 0, Math.PI * 2);
    ctx.stroke();
    // Puck drop text
    ctx.fillStyle = `rgba(255, 204, 0, ${0.5 + pulse * 0.5})`;
    ctx.font = `${5*S}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FACE-OFF', W/2, H/2 - 22*S);
  }

  // Overlays
  if (state === 'periodEnd') {
    ctx.fillStyle = 'rgba(5,5,20,0.6)';
    ctx.fillRect(0, H/2 - 30*S, W, 60*S);
    ctx.fillStyle = '#ffcc00';
    ctx.font = `${10*S}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const endText = (overtime || (period === TOTAL_PERIODS && score[0] === score[1]))
      ? 'OVERTIME' : `END P${period}`;
    ctx.fillText(endText, W/2, H/2);
  }
  if (state === 'gameOver') {
    ctx.fillStyle = 'rgba(5,5,20,0.75)';
    ctx.fillRect(0, H/2 - 50*S, W, 100*S);
    ctx.fillStyle = '#ffcc00';
    ctx.font = `${8*S}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 18*S);
    ctx.font = `${12*S}px 'Press Start 2P', monospace`;
    ctx.fillText(`${score[0]} - ${score[1]}`, W/2, H/2 + 5*S);
    let winner;
    if (score[0] > score[1]) winner = overtime ? 'RED WINS (OT)!' : 'RED WINS!';
    else if (score[1] > score[0]) winner = overtime ? 'BLUE WINS (OT)!' : 'BLUE WINS!';
    else winner = 'TIE!';
    ctx.font = `${7*S}px 'Press Start 2P', monospace`;
    ctx.fillStyle = score[0] > score[1] ? '#ff5050' : score[1] > score[0] ? '#50a0ff' : '#fff';
    ctx.fillText(winner, W/2, H/2 + 28*S);
    ctx.font = `${4*S}px 'Press Start 2P', monospace`;
    ctx.fillStyle = '#888';
    ctx.fillText('TAP TO RESTART', W/2, H/2 + 42*S);
  }
}

function showGoalFlash(team) {
  const el = document.getElementById('goal-flash');
  const span = el.querySelector('span');
  const teamName = team === 0 ? 'RED' : 'BLUE';
  span.textContent = `${teamName} GOAL!`;
  span.style.color = team === 0 ? '#ff5050' : '#50a0ff';
  el.style.background = team === 0 ? 'rgba(255,60,60,0.15)' : 'rgba(60,100,255,0.15)';
  el.style.display = 'flex';
  span.style.animation = 'none';
  void span.offsetWidth;
  span.style.animation = 'goalPulse 0.6s ease-out';
  setTimeout(() => { el.style.display = 'none'; }, 1500);
}

function startGame() {
  if (state === 'gameOver') {
    score = [0, 0]; period = 1;
  }
  if (state === 'menu' || state === 'gameOver') {
    clock = PERIOD_TIME;
    overtime = false;
    particles = [];
    puck = makePuck();
    players = makePlayers();
    state = 'faceoff';
    faceoffTimer = 1.0;
    document.getElementById('msg-overlay').classList.add('hidden');
  }
}

// Tap to restart after game over
canvas.addEventListener('click', () => {
  if (state === 'gameOver') startGame();
});

requestAnimationFrame(gameLoop);
</script>
